name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Librerías del sistema que necesita Qt sin pantalla
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libfontconfig1 libglib2.0-0
      - run: pip install -r requirements.txt
      - name: Estilo de los textos
        run: python scripts/check_text_style.py
      - name: Tests del núcleo
        run: python tests/test_core.py
      - name: Prueba de la interfaz
        run: python tests/smoke_ui.py "$RUNNER_TEMP"
        env:
          QT_QPA_PLATFORM: offscreen

  audit:
    name: Auditoría de seguridad
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install pip-audit bandit
      - name: Vulnerabilidades conocidas en las dependencias
        run: pip-audit -r requirements.txt
      - name: Análisis estático del código
        run: bandit -q -r tuxsign -ll
